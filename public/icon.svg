<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ciel d'aube africaine -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="35%" stop-color="#1B2A41" />
      <stop offset="65%" stop-color="#2D3A45" />
      <stop offset="85%" stop-color="#734B35" />
      <stop offset="100%" stop-color="#C96A3F" />
    </linearGradient>

    <!-- Soleil d'or levant -->
    <radialGradient id="sunGlow" cx="50%" cy="58%" r="50%">
      <stop offset="0%" stop-color="#FFE8A3" stop-opacity="1" />
      <stop offset="35%" stop-color="#D4A24C" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#C96A3F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C96A3F" stop-opacity="0" />
    </radialGradient>

    <!-- Écorce vivante du baobab -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F362D" />
      <stop offset="25%" stop-color="#2D4D41" />
      <stop offset="55%" stop-color="#4A7565" />
      <stop offset="80%" stop-color="#34584A" />
      <stop offset="100%" stop-color="#1B2F27" />
    </linearGradient>

    <!-- Canopée et feuillage luxuriant -->
    <radialGradient id="foliageGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#78A594" />
      <stop offset="45%" stop-color="#4E7B6C" />
      <stop offset="85%" stop-color="#26453A" />
      <stop offset="100%" stop-color="#152821" />
    </radialGradient>

    <!-- Sol et strates d'ancrage -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C96A3F" />
      <stop offset="40%" stop-color="#8F4322" />
      <stop offset="100%" stop-color="#4A2312" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond arrondi premium d'icône d'application -->
  <rect width="512" height="512" rx="116" fill="url(#skyGrad)" />

  <!-- Étoiles de l'aube subtiles dans la voûte céleste -->
  <g fill="#FAF4EA" opacity="0.45">
    <circle cx="110" cy="90" r="1.5" />
    <circle cx="160" cy="130" r="2" opacity="0.7" />
    <circle cx="210" cy="80" r="1.5" />
    <circle cx="340" cy="95" r="2" opacity="0.6" />
    <circle cx="410" cy="120" r="1.5" />
    <circle cx="380" cy="70" r="2.5" opacity="0.8" />
    <circle cx="95" cy="170" r="1.5" />
    <circle cx="430" cy="180" r="1.5" />
  </g>

  <!-- Halo solaire d'espérance derrière la cime -->
  <circle cx="256" cy="275" r="175" fill="url(#sunGlow)" />
  <circle cx="256" cy="275" r="70" fill="#FFF2C6" opacity="0.35" filter="url(#softGlow)" />

  <!-- Sol d'argile africaine & racines souveraines -->
  <ellipse cx="256" cy="450" rx="220" ry="50" fill="url(#groundGrad)" />
  
  <!-- Tronc du Baobab majestueux sculpté avec réalisme -->
  <!-- Racines profondes -->
  <path d="M150 455 C 180 435, 210 420, 225 385 C 235 350, 235 310, 230 280 C 200 250, 160 225, 130 195 C 145 190, 175 210, 205 235 C 215 245, 230 255, 236 270 C 238 230, 230 195, 215 160 C 230 165, 245 185, 252 215 C 255 180, 256 150, 256 135 C 260 160, 262 195, 265 215 C 272 185, 287 165, 302 160 C 287 195, 279 230, 281 270 C 287 255, 302 245, 312 235 C 342 210, 372 190, 387 195 C 357 225, 317 250, 287 280 C 282 310, 282 350, 292 385 C 307 420, 337 435, 367 455 C 320 460, 295 435, 275 410 C 265 398, 256 395, 242 410 C 222 435, 197 460, 150 455 Z" fill="url(#trunkGrad)" />

  <!-- Textures organiques d'écorce mandingue et reliefs de lumière -->
  <g stroke="#FAF4EA" stroke-linecap="round" opacity="0.32" stroke-width="2.5">
    <path d="M246 360 C 248 335, 247 315, 245 295" />
    <path d="M258 375 C 260 345, 261 320, 264 290" />
    <path d="M238 340 C 241 320, 242 300, 240 280" />
    <path d="M272 345 C 270 325, 269 305, 271 285" />
  </g>

  <!-- Canopée dense et vivante : masses feuillues avec volume -->
  <g opacity="0.95">
    <!-- Blocs arrières -->
    <ellipse cx="256" cy="155" rx="90" ry="42" fill="#1C382F" />
    <ellipse cx="165" cy="180" rx="60" ry="34" fill="#203E34" />
    <ellipse cx="347" cy="180" rx="60" ry="34" fill="#203E34" />
    <ellipse cx="120" cy="205" rx="42" ry="26" fill="#1A342B" />
    <ellipse cx="392" cy="205" rx="42" ry="26" fill="#1A342B" />

    <!-- Cime centrale éclatante -->
    <ellipse cx="256" cy="145" rx="80" ry="38" fill="url(#foliageGrad)" />
    <ellipse cx="170" cy="170" rx="55" ry="30" fill="url(#foliageGrad)" />
    <ellipse cx="342" cy="170" rx="55" ry="30" fill="url(#foliageGrad)" />
    <ellipse cx="125" cy="195" rx="38" ry="22" fill="url(#foliageGrad)" />
    <ellipse cx="387" cy="195" rx="38" ry="22" fill="url(#foliageGrad)" />
  </g>

  <!-- Lueur de dignité dorée sur la couronne supérieure -->
  <path d="M 140 160 Q 256 115 372 160" stroke="#FFE38F" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 180 140 Q 256 120 332 140" stroke="#FFF7D6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Oiseaux migrateurs libres d'Afrique s'élevant vers la lumière -->
  <g stroke="#FAF4EA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M 145 110 Q 152 102 159 110 Q 166 102 173 110" />
    <path d="M 335 90 Q 343 81 351 90 Q 359 81 367 90" />
    <path d="M 368 115 Q 374 108 380 115 Q 386 108 392 115" />
  </g>

  <!-- Symbole de la graine ancestrale au cœur des racines -->
  <circle cx="256" cy="415" r="9" fill="#D4A24C" />
  <circle cx="256" cy="415" r="4" fill="#FAF4EA" />
</svg>
